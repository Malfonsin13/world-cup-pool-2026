<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9A%BD</text></svg>">
  <title>⚽ World Cup Pool 2026</title>
  <link rel="stylesheet" href="style.css?v=20260608d">
</head>
<body>

  <!-- Navigation -->
  <nav id="nav" style="display:none;">
    <div class="nav-inner">
      <a class="nav-brand" href="#/picks">⚽ WCP26</a>
      <div class="nav-links">
        <a class="nav-link" data-route="picks" href="#/picks">Picks</a>
        <a class="nav-link" data-route="bracket" href="#/bracket">Bracket</a>
        <a class="nav-link" data-route="macro" href="#/macro">Macro</a>
        <a class="nav-link" data-route="leaderboard" href="#/leaderboard">Leaderboard</a>
        <a class="nav-link" data-route="rules" href="#/rules">Rules</a>
        <a class="nav-link" data-route="admin" href="#/admin">Admin</a>
      </div>
      <button id="logout-btn" class="btn-ghost nav-logout">Sign Out</button>
    </div>
  </nav>

  <!-- Main content -->
  <main id="main"></main>

  <!-- Scripts — loaded in order with a cache-busting version.
       Bump APP_VERSION (and the ?v on the CSS link above) after any change
       so browsers fetch fresh files instead of a stale cached copy. -->
  <script>
    window.APP_VERSION = '20260608d';
    [
      'js/config.js','js/data/fixtures.js','js/api.js','js/auth.js','js/router.js',
      'js/views/picks.js','js/views/bracket.js','js/views/macro.js',
      'js/views/leaderboard.js','js/views/rules.js','js/views/admin.js'
    ].forEach(function (src) {
      document.write('<script src="' + src + '?v=' + window.APP_VERSION + '"><\/script>');
    });
  </script>
  <script>
    Auth.init();
    document.getElementById('logout-btn').addEventListener('click', () => Auth.logout());
    Router.init();
  </script>
</body>
</html>
